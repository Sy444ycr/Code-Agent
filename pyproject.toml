[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "code-agent"
version = "0.1.0"
description = "A local-first coding agent harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "textual>=0.76",
  "rich>=13.7",
  "keyring>=25.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "types-PyYAML>=6.0",
]

[project.scripts]
code-agent = "code_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "code_agent/web_dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["code_agent"]
