services:
  code-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8000"
    restart: unless-stopped
    environment:
      CODE_AGENT_STATE_PATH: /var/lib/code-agent/state.db
    volumes:
      - code-agent-state:/var/lib/code-agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  code-agent-state: {}
